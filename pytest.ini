[pytest]
# 只在 tests/ 下收集，避免扫描仓库根目录里的 build/ 等目录
testpaths = tests
python_files = test_*.py
norecursedirs = .git .venv .agents build ref models node_modules

# 关闭结果缓存插件。
# pytest 写缓存时会在 cache_dir 里另建一个临时目录再改名，这个临时目录在某些
# 受限环境（Windows 沙箱 / 只读 %TEMP% / CI 容器）里建了以后连自己都删不掉，
# 会刷一堆 WinError 5 警告。本项目整套测试不到 1 秒，用不上 --lf / --ff，
# 直接关掉最干净。
addopts = -p no:cacheprovider
